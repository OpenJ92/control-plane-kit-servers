[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-plane-kit-servers"
version = "0.1.0"
description = "Reusable OCI server products and descriptors for control-plane-kit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "control-plane-kit-secrets @ https://github.com/OpenJ92/control-plane-kit-secrets/archive/1963663d94428114da7fcd15c45c20b9e753db83.zip",
  "control-plane-kit-server-sdk[fastapi] @ https://github.com/OpenJ92/control-plane-kit-server-sdk/archive/e7f517ab79060c52f5942ae82bd2cb8fdc9ee4b1.zip",
  "control-plane-kit-core @ https://github.com/OpenJ92/control-plane-kit/archive/8d3969f239569aa10582337838edc10ed2f57393.zip#subdirectory=control-plane-kit-core",
  "control-plane-kit-operations @ https://github.com/OpenJ92/control-plane-kit/archive/503de09f21c04cb2f418719b89129f7741345585.zip#subdirectory=control-plane-kit-operations",
  "control-plane-kit-interpreters[cloudflare,docker,gateway,public-dns] @ https://github.com/OpenJ92/control-plane-kit-interpreters/archive/3e8104fa2aba1275b60ce98db5c46927fbf7b335.zip",
  "uvicorn>=0.30",
  "httpx>=0.27,<1",
  "mcp==2.3.0",
]

[project.scripts]
cpk = "control_plane_kit_servers_cpk_server.client.cli:main"

[tool.setuptools.packages.find]
where = ["src", "products/cpk_server/src", "products/hello_server/src", "products/http_active_router/src", "products/http_multiplexer/src", "products/cpk_local_gateway/src", "products/secrets_server/src", "products/cloudflared_connector/src", "products/postgres_server/src", "products/website_server/src"]

[tool.setuptools.package-data]
control_plane_kit_servers = ["catalogue.json", "catalogue.json.sha256"]
