[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-plane-kit-servers"
version = "0.1.0"
description = "Reusable OCI server products and descriptors for control-plane-kit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "control-plane-kit-secrets @ https://github.com/OpenJ92/control-plane-kit-secrets/archive/158b17ed10689360c4e1529a395b3ee2b47aecbc.zip",
  "control-plane-kit-server-sdk[fastapi] @ https://github.com/OpenJ92/control-plane-kit-server-sdk/archive/d61b374cb2a23d773c31748f47f88169499298b7.zip",
  "control-plane-kit-core @ https://github.com/OpenJ92/control-plane-kit/archive/976901c609d950a557ec1e9966f018e8ff6e16aa.zip#subdirectory=control-plane-kit-core",
  "control-plane-kit-operations @ https://github.com/OpenJ92/control-plane-kit/archive/885513e348b5b9cdb077c9f8804e98d9b2c0e803.zip#subdirectory=control-plane-kit-operations",
  "control-plane-kit-interpreters[cloudflare,docker,gateway,public-dns] @ https://github.com/OpenJ92/control-plane-kit-interpreters/archive/e4bd35e828d1c44129f64e702de2b1d2b60f7c87.zip",
  "uvicorn>=0.30",
  "httpx>=0.27,<1",
]

[project.scripts]
cpk = "control_plane_kit_servers_cpk_server.client.cli:main"

[tool.setuptools.packages.find]
where = ["src", "products/cpk_server/src", "products/hello_server/src", "products/http_active_router/src", "products/http_multiplexer/src", "products/cpk_local_gateway/src", "products/secrets_server/src", "products/cloudflared_connector/src", "products/postgres_server/src", "products/website_server/src"]

[tool.setuptools.package-data]
control_plane_kit_servers = ["catalogue.json", "catalogue.json.sha256"]
