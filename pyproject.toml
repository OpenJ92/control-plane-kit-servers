[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-plane-kit-servers"
version = "0.1.0"
description = "Reusable OCI server products and descriptors for control-plane-kit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "control-plane-kit-secrets @ https://github.com/OpenJ92/control-plane-kit-secrets/archive/067678fbaa297d3206ff13d018c69bc14387e46c.zip",
  "control-plane-kit-server-sdk[fastapi] @ https://github.com/OpenJ92/control-plane-kit-server-sdk/archive/464df26c568971362eb3a08abaf9dfc227a4ddbb.zip",
  "control-plane-kit-core @ https://github.com/OpenJ92/control-plane-kit/archive/fec0816281aeb83ede98616adcc4f96dfe5777a8.zip#subdirectory=control-plane-kit-core",
  "control-plane-kit-operations @ https://github.com/OpenJ92/control-plane-kit/archive/fec0816281aeb83ede98616adcc4f96dfe5777a8.zip#subdirectory=control-plane-kit-operations",
  "control-plane-kit-interpreters[cloudflare,docker,gateway,public-dns] @ https://github.com/OpenJ92/control-plane-kit-interpreters/archive/bd08b931ae9241878ce4f4b7072f95ccebfa3536.zip",
  "uvicorn>=0.30",
  "httpx>=0.27,<1",
]

[project.scripts]
cpk = "control_plane_kit_servers_cpk_server.client.cli:main"

[tool.setuptools.packages.find]
where = ["src", "products/cpk_server/src", "products/hello_server/src", "products/http_active_router/src", "products/http_multiplexer/src", "products/cpk_local_gateway/src", "products/secrets_server/src", "products/cloudflared_connector/src", "products/postgres_server/src"]

[tool.setuptools.package-data]
control_plane_kit_servers = ["catalogue.json", "catalogue.json.sha256"]
